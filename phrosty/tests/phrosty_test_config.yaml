replaceable_preloads:
  - ${SNPIT_DEFAULT_CONFIG}

system:
  paths:
    temp_dir: phrosty/tests/test_output/temp
    phrosty:
      dia_out_dir: phrosty/tests/test_output/dia_out_dir
      ltcv_dir: phrosty/tests/test_output/lc_out_dir
      intermediate_dir: phrosty/tests/test_output/intermediate_dir

  ou24:
    simdex_server: https://roman-desc-simdex.lbl.gov
    tds_base: ../photometry_test_data/ou2024
    config_file: ../photometry_test_data/ou2024/tds.yaml
    images: ../photometry_test_data/ou2024/images/simple_model


photometry:
  phrosty:
    keep_intermediate: true
    remove_temp_dir: false
    mem_trace: false
    kerpolyorder: 2

    sfft:
      radius_cut_detmask: 2

    psf:
      type: gaussian
      params: {'sigmax': 0.43, 'sigmay': 0.43}
