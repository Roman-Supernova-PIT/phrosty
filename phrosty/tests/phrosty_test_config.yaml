replaceable_preloads:
  - ${SNPIT_DEFAULT_CONFIG}

system:
  paths:
    dev_storage: phrosty/tests/test_output
    temp_dir: phrosty/tests/test_output/temp

  ou24:
    config_file: ${PWD}/../photometry_test_data/ou2024/tds.yaml
    tds_base: ${PWD}/../photometry_test_data/ou2024
    images: ${PWD}/../photometry_test_data/ou2024/images/simple_model

photometry:
  phrosty:
    verbose: true
    keep_intermediate: true
    remove_temp_dir: false
    mem_trace: true
    nprocs: 1
    nwrite: 1

    sfft:
      radius_cut_detmask: 2
      kerpolyorder: 2

    psf:
      type: gaussian
      params: {'sigmax': 0.43, 'sigmay': 0.43}
